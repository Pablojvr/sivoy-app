name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "codex/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/') }}

jobs:
  change_scope:
    name: Determine CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify change classifier
        run: node --test scripts/detect-ci-scope.test.cjs

      - name: Classify changed files
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/ci-scope-output.txt"
          zero_sha='0000000000000000000000000000000000000000'

          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]] || \
             { [[ "${EVENT_NAME}" == 'push' ]] && [[ "${REF_NAME}" =~ ^(main|develop)$ ]]; }; then
            printf '' | node scripts/detect-ci-scope.cjs --full > "${output_file}"
          else
            head_sha="${CURRENT_SHA}"
            base_sha="${BEFORE_SHA:-}"

            if [[ "${EVENT_NAME}" == 'pull_request' ]]; then
              base_sha="${PR_BASE_SHA}"
              head_sha="${PR_HEAD_SHA}"
            elif [[ -z "${base_sha}" || "${base_sha}" == "${zero_sha}" ]] || \
                 ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin develop
              base_sha="$(git merge-base "${head_sha}" origin/develop)"
            fi

            if [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ ]] || \
               [[ ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]] || \
               ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null || \
               ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
              printf '' | node scripts/detect-ci-scope.cjs --full > "${output_file}"
            else
              git diff --name-only -z "${base_sha}" "${head_sha}" | node scripts/detect-ci-scope.cjs > "${output_file}"
            fi
          fi

          cat "${output_file}" >> "${GITHUB_OUTPUT}"

          backend="$(sed -n 's/^backend=//p' "${output_file}")"
          frontend="$(sed -n 's/^frontend=//p' "${output_file}")"
          reason="$(sed -n 's/^reason=//p' "${output_file}")"
          changed_count="$(sed -n 's/^changed_count=//p' "${output_file}")"
          {
            echo '### CI scope'
            echo '| Area | Required |'
            echo '| --- | --- |'
            echo "| Backend | ${backend} |"
            echo "| Frontend | ${frontend} |"
            echo
            echo "Reason: \`${reason}\`. Changed paths evaluated: ${changed_count}."
          } >> "${GITHUB_STEP_SUMMARY}"

  backend_verify:
    name: Backend verification
    needs: change_scope
    if: ${{ needs.change_scope.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sivoy_migrations_ci
          POSTGRES_USER: sivoy_ci_user
          POSTGRES_PASSWORD: sivoy_ephemeral_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sivoy_ci_user -d sivoy_migrations_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: Verify npm version
        run: corepack npm --version | grep -Fx '11.11.0'

      - name: Verify dependency policy
        run: node ../scripts/check-install-scripts.cjs package-lock.json backend

      - name: Install dependencies without lifecycle scripts
        run: corepack npm ci --ignore-scripts

      - name: Verify package signatures before lifecycle scripts
        run: corepack npm audit signatures

      - name: Build approved native dependency
        run: corepack npm rebuild sqlite3 --ignore-scripts=false
        
      - name: Audit production dependencies
        run: corepack npm audit --omit=dev --audit-level=high
        
      - name: Run backend tests
        run: corepack npm test

      - name: Run ephemeral PostgreSQL migration validation
        env:
          DATABASE_URL: postgresql://sivoy_ci_user:sivoy_ephemeral_ci_password@127.0.0.1:5432/sivoy_migrations_ci
          DATABASE_SSL: "false"
          MIGRATION_TEST_SENTINEL: allow_ephemeral_migration_test
        run: corepack npm run test:migrations:pg

      - name: Measure T14 query performance baseline
        env:
          DATABASE_URL: postgresql://sivoy_ci_user:sivoy_ephemeral_ci_password@127.0.0.1:5432/sivoy_migrations_ci
          DATABASE_SSL: "false"
          MIGRATION_TEST_SENTINEL: allow_ephemeral_migration_test
          QUERY_PERF_TEST_SENTINEL: allow_ephemeral_query_performance_test
          QUERY_PERF_REPORT_PATH: ${{ runner.temp }}/t14-query-performance-report.json
        run: node --test integration/query-performance.pg.spec.js

      - name: Publish T14 query performance baseline
        run: node integration/publish-query-performance-report.js "${{ runner.temp }}/t14-query-performance-report.json"

      - name: Compare catalog indexes at 10k and 100k points
        env:
          DATABASE_URL: postgresql://sivoy_ci_user:sivoy_ephemeral_ci_password@127.0.0.1:5432/sivoy_migrations_ci
          DATABASE_SSL: "false"
          CATALOG_SCALE_TEST_SENTINEL: allow_ephemeral_catalog_scale_test
        run: corepack npm run test:catalog-scale:pg
        
      - name: Validate server syntax
        run: node --check server.js

  frontend_verify:
    name: Frontend verification
    needs: change_scope
    if: ${{ needs.change_scope.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Verify npm version
        run: corepack npm --version | grep -Fx '11.11.0'

      - name: Verify dependency policy
        run: node ../scripts/check-install-scripts.cjs package-lock.json frontend

      - name: Install dependencies without lifecycle scripts
        run: corepack npm ci --ignore-scripts

      - name: Verify package signatures before lifecycle scripts
        run: corepack npm audit signatures

      - name: Build approved native dependencies
        # fsevents remains lockfile-validated but is Darwin-only and absent on this Linux runner.
        run: corepack npm rebuild @parcel/watcher esbuild lmdb msgpackr-extract --ignore-scripts=false
        
      - name: Audit dependencies
        run: corepack npm audit --audit-level=high
        
      - name: Verify CSS color contract
        run: corepack npm run check:css-colors

      - name: Verify architectural boundaries
        run: corepack npm run check:boundaries

      - name: Run frontend tests
        run: corepack npm run test:ci
        
      - name: Build frontend production
        run: corepack npm run build -- --configuration production

      - name: Install Chromium for browser smoke
        run: corepack npm run playwright:install

      - name: Run public shipment browser smoke
        run: corepack npm run e2e -- --ignore-snapshots

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Backend CI
    needs:
      - change_scope
      - backend_verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm backend gate
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.change_scope.result }}
          REQUIRED: ${{ needs.change_scope.outputs.backend }}
          VERIFICATION_RESULT: ${{ needs.backend_verify.result }}
        run: |
          set -euo pipefail
          if [[ "${SCOPE_RESULT}" != 'success' ]]; then
            echo 'The CI scope classifier did not complete successfully.' >&2
            exit 1
          fi
          if [[ "${REQUIRED}" == 'true' && "${VERIFICATION_RESULT}" != 'success' ]]; then
            echo "Backend verification result: ${VERIFICATION_RESULT}." >&2
            exit 1
          fi
          if [[ "${REQUIRED}" != 'true' && "${VERIFICATION_RESULT}" != 'skipped' ]]; then
            echo "Unexpected backend verification result: ${VERIFICATION_RESULT}." >&2
            exit 1
          fi
          echo "Backend required: ${REQUIRED}; verification: ${VERIFICATION_RESULT}."

  frontend:
    name: Frontend CI
    needs:
      - change_scope
      - frontend_verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm frontend gate
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.change_scope.result }}
          REQUIRED: ${{ needs.change_scope.outputs.frontend }}
          VERIFICATION_RESULT: ${{ needs.frontend_verify.result }}
        run: |
          set -euo pipefail
          if [[ "${SCOPE_RESULT}" != 'success' ]]; then
            echo 'The CI scope classifier did not complete successfully.' >&2
            exit 1
          fi
          if [[ "${REQUIRED}" == 'true' && "${VERIFICATION_RESULT}" != 'success' ]]; then
            echo "Frontend verification result: ${VERIFICATION_RESULT}." >&2
            exit 1
          fi
          if [[ "${REQUIRED}" != 'true' && "${VERIFICATION_RESULT}" != 'skipped' ]]; then
            echo "Unexpected frontend verification result: ${VERIFICATION_RESULT}." >&2
            exit 1
          fi
          echo "Frontend required: ${REQUIRED}; verification: ${VERIFICATION_RESULT}."
