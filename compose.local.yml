name: sivoy-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sivoy
      POSTGRES_USER: sivoy
      POSTGRES_PASSWORD: sivoy_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql/data
      - ./backend/local/bootstrap/0000_legacy_schema.sql:/docker-entrypoint-initdb.d/0000_legacy_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivoy -d sivoy"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
