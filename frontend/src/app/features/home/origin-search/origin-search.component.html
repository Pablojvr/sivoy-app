<div class="selected-destination-context" *ngIf="destinationName">
  <span>Enviando a</span>
  <strong>{{ destinationName }}</strong>
</div>

<label class="destination-input-label" for="origin-location">Punto de origen</label>
<div class="destination-input-shell">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="7"></circle>
    <path d="m20 20-4-4"></path>
  </svg>
  <input
    id="origin-location"
    type="text"
    inputmode="search"
    autocomplete="off"
    placeholder="Municipio o agencia de origen"
    [value]="visibleValue"
    (input)="onInput($event)"
    (focus)="onFocus()"
    aria-controls="origin-options"
    aria-autocomplete="list">
  <button
    type="button"
    class="input-clear-btn"
    *ngIf="visibleValue"
    (click)="onClear($event)"
    aria-label="Borrar origen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"></path></svg>
  </button>
</div>

<button
  type="button"
  class="origin-place-helper-trigger"
  [attr.aria-expanded]="showPlaceHelper"
  aria-controls="origin-place-helper"
  (click)="onTogglePlaceHelper()">
  <span class="origin-place-helper-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5.5-8 11-8 11S4 15.5 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
  </span>
  <span><strong>¿No sabes el municipio?</strong><small>Busca un centro comercial, mercado o lugar conocido</small></span>
  <svg class="origin-place-helper-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path [attr.d]="showPlaceHelper ? 'm18 15-6-6-6 6' : 'm9 18 6-6-6-6'"></path></svg>
</button>

<section id="origin-place-helper" class="origin-place-helper" *ngIf="showPlaceHelper" aria-label="Buscar origen por lugar conocido">
  <div class="place-helper-heading">
    <span><small>Ayuda opcional</small><strong>Buscar un lugar</strong></span>
    <span class="google-source">Google</span>
  </div>
  <label class="place-helper-search">
    <span class="sr-only">Nombre del lugar</span>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
    <input
      type="search"
      autocomplete="off"
      placeholder="Ej. Metrocentro San Salvador"
      [value]="placeSearchQuery"
      (input)="onPlaceSearchInput($event)">
    <button type="button" *ngIf="placeSearchQuery" (click)="onClearPlaceSearch()" aria-label="Limpiar lugar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"></path></svg>
    </button>
  </label>

  <div class="place-helper-loading" *ngIf="placeSearchLoading" role="status">
    <span aria-hidden="true"></span> Identificando municipio…
  </div>

  <div class="place-helper-results" *ngIf="!placeSearchLoading && placeSuggestions.length > 0" role="listbox">
    <button type="button" *ngFor="let suggestion of placeSuggestions" (click)="onSelectPlaceSuggestion(suggestion)">
      <span class="place-result-pin" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5.5-8 11-8 11S4 15.5 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      </span>
      <span><strong>{{ suggestion.mainText }}</strong><small>{{ suggestion.secondaryText }}</small></span>
      <svg class="place-result-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
  </div>

  <p class="place-helper-message" *ngIf="!placeSearchLoading && placeSearchError">{{ placeSearchError }}</p>
  <p class="place-helper-caption" *ngIf="!placeSearchLoading && !placeSearchError && placeSuggestions.length === 0">
    Elegiremos el municipio registrado; el lugar no reemplaza tu punto de origen.
  </p>
</section>

<div id="origin-options" class="destination-options-list origin-options-list" role="listbox" *ngIf="isListVisible">
  <button type="button" class="destination-option current-location-option" *ngIf="userLocationAvailable && (!visibleValue || visibleValue === 'Mi Ubicación')" (click)="onSelectUserLocation()">
    <span class="destination-option-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg>
    </span>
    <span class="destination-option-copy"><strong>Mi ubicación</strong><span>{{ userMunicipalityName || 'Usar ubicación actual' }}</span></span>
  </button>

  <div class="option-section-label" *ngIf="municipalities.length > 0">Municipios</div>
  <button type="button" class="destination-option" *ngFor="let mun of municipalities" (click)="onSelectMunicipality(mun)">
    <span class="destination-option-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5.5-8 11-8 11S4 15.5 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
    </span>
    <span class="destination-option-copy"><strong>{{ mun.municipio }}</strong><span>{{ mun.departamento }}</span></span>
    <span class="destination-point-count">{{ mun.pointCount }} {{ mun.pointCount === 1 ? 'punto' : 'puntos' }}</span>
  </button>

  <div class="option-section-label" *ngIf="agencyPoints.length > 0">
    {{ agencySectionLabel }}
  </div>
  <button type="button" class="destination-option" *ngFor="let loc of agencyPoints" (click)="onSelectLocation(loc)">
    <span class="destination-option-icon agency-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V8l8-5 8 5v13"></path><path d="M9 21v-6h6v6M8 10h.01M12 10h.01M16 10h.01"></path></svg>
    </span>
    <span class="destination-option-copy"><strong>{{ loc.nombre_destino }}</strong><span>{{ loc.ubicacion?.municipio }} · {{ loc.empresa }}</span></span>
  </button>

  <div class="destination-empty-state compact" *ngIf="municipalities.length === 0 && agencyPoints.length === 0 && visibleValue">
    <strong>No encontramos ese origen</strong>
    <span>Prueba con otro municipio o agencia.</span>
  </div>
</div>
