<div class="app-container mobile-first-layout" [class.map-resource-mode]="isMapResourceMode" [class.list-first-mode]="!isMapResourceMode" (click)="collapseSheet()">
  
  <div class="inicio-tab-content" [hidden]="activeMainTab !== 'inicio' && !isPickingLocation && !isMapForcedVisible">
    <app-home
      [mapAvailable]="mapAvailable"
      [locations]="locations"
      [userLocation]="userLocation"
      [initialIntent]="navigationIntent"
      [selectedPin]="selectedPin"
      [isPickingLocation]="isPickingLocation"
      [highlightedRoute]="highlightedRoute"
      [mapResourceMode]="isMapResourceMode"
      (updateMapMarkers)="updateMapMarkers()"
      (clearMap)="resetMapMarkers()"
      (mapHighlightRoute)="onMapHighlightRoute($event); setMapResourceMode(true)"
      (recenterMapEvent)="recenterMap()"
      (resetMapMarkersEvent)="resetMapMarkers()"
      (showNearbyPointsEvent)="showNearbyPoints()"
      (previewImageEvent)="fullScreenImage = $event"
      (showPinDetails)="viewOnMap($event.location, $event.type)"
      (mapResourceModeChange)="setMapResourceMode($event)"
    ></app-home>
  </div>

  <div class="admin-tab-content" *ngIf="activeMainTab === 'puntos' && !isPickingLocation">
    <app-admin #adminRef
      [locations]="locations"
      (viewOnMapEvent)="viewOnMap($event)"
      (minimizeModalEvent)="isMapForcedVisible = $event"
      (previewMapEvent)="previewMap($event)"
      (previewImageEvent)="fullScreenImage = $event"
    ></app-admin>
  </div>

  <app-perfil *ngIf="activeMainTab === 'perfil'"></app-perfil>

  <div *ngIf="mapFallbackVisible" role="status" class="map-fallback-banner">
    <div class="map-fallback-banner-content">
      <strong>Mapa no disponible</strong>
      <p>Puedes seguir buscando y compartiendo puntos desde la lista.</p>
    </div>
    <button type="button" class="map-fallback-close" (click)="mapFallbackVisible = false; $event.stopPropagation()" aria-label="Cerrar">×</button>
  </div>

  <app-bottom-nav [activeTab]="activeMainTab"></app-bottom-nav>

  <!-- FULLSCREEN IMAGE PREVIEW -->
  <div class="image-preview-overlay fade-in" *ngIf="fullScreenImage" (click)="fullScreenImage = null" role="dialog" aria-modal="true" aria-label="Vista previa de imagen">
    <button class="image-preview-close" type="button" aria-label="Cerrar vista previa" (click)="fullScreenImage = null">
      &times;
    </button>
    <img class="image-preview-content" [src]="fullScreenImage" alt="Vista previa ampliada" (click)="$event.stopPropagation()">
  </div>

</div>
