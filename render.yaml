services:
  - type: web
    name: sivoy-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: "cd frontend && corepack npm ci && corepack npm run build -- --configuration production && cd ../backend && corepack npm ci --omit=dev"
    startCommand: "cd backend && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: "https://sivoy-backend.onrender.com"
      - key: MAPBOX_PUBLIC_TOKEN
        sync: false
